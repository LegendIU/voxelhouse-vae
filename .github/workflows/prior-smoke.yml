name: prior-smoke

on:
  push:
    paths:
      - 'src/latent_transformer.py'
      - 'src/conditioning.py'
      - 'src/conditional_sampling.py'
      - 'tests/**'
      - '.github/workflows/prior-smoke.yml'
  pull_request:
    paths:
      - 'src/latent_transformer.py'
      - 'src/conditioning.py'
      - 'src/conditional_sampling.py'
      - 'tests/**'
      - '.github/workflows/prior-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy torch

      - name: Run prior smoke tests
        run: |
          pytest -q tests/test_latent_transformer.py tests/test_conditioning.py tests/test_sampling_modes.py
